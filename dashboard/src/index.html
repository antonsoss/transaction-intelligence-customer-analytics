<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Transaction Intelligence</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Customer behavior, segmentation, and responsible model validation using the Berka banking dataset."
    />
    <meta name="theme-color" content="#f6f8fa" />
    <script>
      (() => {
        const storageKey = 'transaction-intelligence-theme';
        let storedTheme = null;

        try {
          storedTheme = localStorage.getItem(storageKey);
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }

        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : systemTheme;
        document.documentElement.dataset['theme'] = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0d1117' : '#f6f8fa');
      })();
    </script>
    <link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="brand/favicon.ico" />
    <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
