[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-intelligence-customer-analytics"
version = "0.1.0"
description = "Customer segmentation and behavioral analytics using the Berka banking dataset"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "duckdb>=1.1",
    "fastapi[standard]>=0.139.2",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "mlxtend>=0.23",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyMySQL>=1.1",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
