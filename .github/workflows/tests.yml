name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.14.6 unit and contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgomp1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check Python code quality
        run: python -m ruff check src scripts tests

      - name: Run unit and contract tests
        run: python -m pytest -v

  dashboard-tests:
    name: Angular unit tests and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm --dir dashboard install --frozen-lockfile

      - name: Run dashboard unit tests
        run: pnpm --dir dashboard test

      - name: Build dashboard
        run: pnpm --dir dashboard build
